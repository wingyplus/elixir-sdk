# Dagger workspace configuration
# Install modules with: dagger install <module>

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.elixir-sdk]
source = "."
check.skip = ["*"]

[modules.elixir-sdk.as-sdk]
name = "elixir"

[modules.dev]
source = ".dagger/modules/dev"

[modules.sdk-sdk]
source = "github.com/dagger/sdk-sdk"
